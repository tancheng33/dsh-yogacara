# The configuration layer this bundle contributes when a profile lists it.
# Users override any key here from their own profile `cordis.patch.yml`.
#
# This layer inserts exactly one row. It deliberately does NOT insert the
# storage stack the store consciousness needs, even though it cannot work
# without one: `insert` appends rows unconditionally, and the loader rejects
# two rows sharing an id, so a bundle that inserts `storage` breaks every
# profile whose other bundles already have it — `dsh-web-app` among them,
# which is the common case. Renaming the rows does not help: a second backend
# under a different id competes to provide the same service.
#
# So the stack is the profile's to own. A profile stacking `dsh-web-app`
# already has it and needs nothing. A `dsh-base`-only profile has none, and
# 阿赖耶识 is durable, so it needs three rows in its own patch — see "Install"
# in the README for the YAML to paste.
- insert:
    - id: yogacara
      name: dsh-yogacara
      config:
        # Which storage domain the store consciousness (阿赖耶识) persists under.
        # One name is one store; run two rows with different names to give two
        # agents genuinely separate histories.
        domain: alaya
        # Derive contacts from the conversation itself: being interrupted,
        # answered in one syllable after a long reply, asked the same thing
        # again, thanked. This is where a chat agent's feeling comes from.
        observeChat: true
        # Derive contacts automatically from tool results. With this off the
        # mind moves only when the model calls `self_appraise` — honest, but
        # sparse, and the seed store stays nearly empty.
        observeTools: true
        # Write the first-person self-report into the system prompt. This is
        # what makes the state something the agent can act on rather than
        # something only a dashboard can read.
        promptSection: true
        # How that state reaches the agent:
        #   felt   — a first-person leaning, no numbers, no factor names
        #   report — the full instrument panel, for tuning and auditing
        #   silent — nothing in the prompt; mood-congruent recall still works
        awareness: felt
        # Upper bound on mental factors listed under `report`.
        promptMaxFactors: 5
        # Self-grasping (末那) at or above this renders as a warning with its
        # measurement proxy and its counter-move, not just a number.
        manasWarning: 0.5
        # 刹那 — milliseconds for one factor's activation to halve. Short on
        # purpose: an agent that carries its irritation from the failing test
        # into the next unrelated task is modelling a grudge, not a mind.
        halfLifeMs: 300000
        # Milliseconds for one seed's potency to halve. Long on purpose: the
        # store is the part worth keeping across sessions.
        seedHalfLifeMs: 1209600000
        # Upper bound on stored seeds; the weakest are forgotten past it.
        maxSeeds: 2000
        # Minimum milliseconds between durable writes of the momentary state.
        # Seeds are written immediately; the mood is coalesced because it moves
        # on every tool call.
        flushIntervalMs: 15000
